default_job = "run"

[jobs.check]
command = [
  "cargo",
  "check",
  "--color",
  "always",
  "--all-targets",
  "--all-features",
]
need_stdout = false
watch = ["crates"]

[jobs.clippy]
command = [
  "cargo",
  "clippy",
  "--color",
  "always",
  "--all-targets",
  "--all-features",
  "--",
  "-D",
  "warnings",
]
need_stdout = false
watch = ["crates"]

[jobs.test]
command = [
  "cargo",
  "test",
  "--color",
  "always",
  "--all-targets",
  "--all-features",
]
need_stdout = true
watch = ["crates"]

[jobs.run]
command = ["cargo", "run", "--color", "always"]
need_stdout = true
allow_hierarchical_nav = true
watch = ["crates"]
on_change_strategy = "kill_then_restart"

[keybindings]
c = "job:clippy"
t = "job:test"
r = "job:run"
